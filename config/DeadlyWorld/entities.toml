  mimics.chest_attributes = [
    "minecraft:generic.max_health + 15.0",
    "minecraft:generic.movement_speed * 1.0",
    "minecraft:generic.attack_damage + 2.0"
  ]
  # List of IDs for loot tables that can have a Mimic Core item added to them by Deadly World.
  # Each ID is paired with a chance value (the chance for a Mimic Core to be added to the loot table).
  # Chance is in percents, so it should range from 0.0 to 1.0.
  # Mimic Cores are what makes chests come alive and become Chest Mimics, so if one exists in a chest's inventory,
  # be it either because of a loot modifier or because someone put it there, the chest will come alive when opened.
  # <Resource Location value List> Format: [ "namespace:path value", ... ], Default: "N/A"
  mimics.chest_target_loot_tables = [
    "minecraft:chests/abandoned_mineshaft 0.2",
    "minecraft:chests/ancient_city 0.2",
    "minecraft:chests/bastion_bridge 0.2",
    "minecraft:chests/bastion_treasure 0.2",
    "minecraft:chests/desert_pyramid 0.2",
    "minecraft:chests/end_city_treasure 0.2",
    "minecraft:chests/igloo_chest 0.1",
    "minecraft:chests/jungle_temple 0.2",
    "minecraft:chests/nether_bridge 0.2",
    "minecraft:chests/ruined_portal 0.1",
    "minecraft:chests/simple_dungeon 0.3",
    "minecraft:chests/spawn_bonus_chest 0.5",
    "minecraft:chests/stronghold_corridor 0.3",
    "minecraft:chests/jungle_temple 0.2",
