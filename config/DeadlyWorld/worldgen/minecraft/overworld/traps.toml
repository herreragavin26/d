  #   chosen
  # at random when the trap is generated. If the trap is generated as 'dynamic_chance' it will pick again
  # between each potion effect.
  # Overriding this setting via data pack is NOT supported.
  # <Registry Entry-value List> Format: [ "namespace:registry_name value1 value2 value3", ... ], Default: [
  #   "minecraft:poison 20.0 200.0 0.0", "minecraft:slowness 20.0 200.0 1.0", "minecraft:weakness 20.0 150.0 1.0",
  #   "minecraft:instant_damage 20.0 1.0 1.0", "minecraft:hunger 20.0 500.0 1.0" ]
