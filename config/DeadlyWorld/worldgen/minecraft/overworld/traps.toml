  #    Range for Values: ≥ 0.0
  potion_traps.potion_list = [
    "minecraft:poison 20.0 200.0 0.0",
    "minecraft:slowness 20.0 200.0 1.0",
    "minecraft:weakness 20.0 150.0 1.0",
    "minecraft:instant_damage 20.0 1.0 1.0",
    "minecraft:hunger 20.0 500.0 1.0"
  ]
  # The chance for potion traps to generate as 'dynamicChance'.
  # Dynamic potion traps pick a new potion every time they trigger.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: 0.0 ~ 1.0, Default: 0.2
  potion_traps.dynamic_chance = 0.2


