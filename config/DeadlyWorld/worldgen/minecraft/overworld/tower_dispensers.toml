# deadlyworld:worldgen/minecraft/overworld/tower_dispensers.toml
# This config contains options for all tower dispenser features specific to the 'overworld' dimension from 'minecraft'.

# This config also functions as the default settings for tower dispenser features in any extra dimensions that do not
#   have world gen configs (all dimensions not included in the "general.extra_dimensions" list within the mod's main
#   config file, "_main").



# Category: simple_tower_dispensers
# Options to customize simple tower dispensers specific to the 'overworld' dimension from 'minecraft'.

  # When set to true, places a 1x1 column of glass to the height limit from a few blocks above each generated simple
  #   tower dispensers. This is game-breaking and laggy. Also prints a message to the console.
  # Consider using a tool to strip away all stone/dirt/etc. or xray after world gen for more intensive testing.
  # Overriding this setting via data pack is NOT supported.
  # <Boolean> Valid Values: { true, false }, Default: false
  simple_tower_dispensers.testing_markers = false

  # The number of placement attempts per chunk (16x16 blocks) for simple tower dispensers. A decimal represents a
  #   chance for a placement attempt (e.g., 0.3 means 30% chance for one attempt).
  # This setting can be overridden for world gen by 'placed_feature' files in data packs.
  # <Number> Range: ≥ 0.0, Default: 0.6
  simple_tower_dispensers.placements = 0.6

  # The minimum and maximum (inclusive) heights/y-values simple tower dispensers can generate at.
  # This setting can be overridden for world gen by 'placed_feature' files in data packs.
  # <Integer> Range: Any Value, Default: -54
  simple_tower_dispensers.height.min = -54
  # <Integer> Range: Any Value, Default: 54
  simple_tower_dispensers.height.max = 54
  # These tower dispensers are active as long as a player is within this distance (spherical distance).
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: ≥ 0.0, Default: 9.0
  simple_tower_dispensers.required_player_range = 9.0
  # The chance for simple tower dispensers to generate as requiring a sight check.
  # When the sight check is enabled, simple tower dispensers will only activate when they have direct line-of-sight to
  #   a player within activation range. The simple tower dispensers's delay will continue to tick down, but it will wait
  #   to actually activate until it has line-of-sight.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: 0.0 ~ 1.0, Default: 1.0
  simple_tower_dispensers.sight_check_chance = 1.0

  # The minimum and maximum (inclusive) delay between attacks, in ticks. (20 ticks = 1 second)
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Integer> Range: 0 ~ 32767, Default: 20
  simple_tower_dispensers.attack_delay.min = 20
  # <Integer> Range: 0 ~ 32767, Default: 40
  simple_tower_dispensers.attack_delay.max = 40
  # The base damage of attacks from simple tower dispensers.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: ≥ 0.0, Default: 3.0
  simple_tower_dispensers.attack_damage = 3.0

  # The base speed of projectiles fired by simple tower dispensers.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: ≥ 0.0, Default: 1.0
  simple_tower_dispensers.projectile_speed = 1.0
  # The inaccuracy of projectiles fired by simple tower dispensers.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: ≥ 0.0, Default: 0.08
  simple_tower_dispensers.projectile_variance = 0.08


