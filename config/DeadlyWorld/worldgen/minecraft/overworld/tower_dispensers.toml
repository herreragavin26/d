  # Weighted list of potion effects that can be used by potion tower dispenserss when shooting tipped arrows. One of
  #   these is chosen
  # at random when the tower dispenser is generated. If the tower dispenser is generated as 'dynamic_chance' it will
  #   pick again
  # between each potion effect.
  # Overriding this setting via data pack is NOT supported.
  # <Registry Entry-value List> Format: [ "namespace:registry_name value1 value2 value3", ... ], Default: [
  #   "minecraft:poison 30.0 280.0 0.0", "minecraft:slowness 20.0 300.0 1.0", "minecraft:weakness 20.0 250.0 1.0",
  #   "minecraft:instant_damage 20.0 1.0 1.0", "minecraft:hunger 20.0 500.0 1.0", "minecraft:blindness 20.0 250.0",
  #   "minecraft:unluck 5.0 9000.0" ]
  #    Target registry: ResourceKey[minecraft:root / minecraft:mob_effect]
  #    Range for Values: ≥ 0.0
  potion_tower_dispensers.potion_list = [
    "minecraft:poison 30.0 280.0 0.0",
    "minecraft:slowness 20.0 300.0 1.0",
    "minecraft:weakness 20.0 250.0 1.0",
    "minecraft:instant_damage 20.0 1.0 1.0",
    "minecraft:hunger 20.0 500.0 1.0",
    "minecraft:blindness 20.0 250.0 0.0",
    "minecraft:unluck 5.0 9000.0 0.0"
  ]
  # The chance for potion tower dispensers to generate as 'dynamicChance'.
  # Dynamic potion towers pick a new potion every time they shoot a tipped arrow.
  # This setting can be overridden for world gen by 'configured_feature' files in data packs.
  # <Number> Range: 0.0 ~ 1.0, Default: 0.2
  potion_tower_dispensers.dynamic_chance = 0.2


